name: Verify synthetic forensic package
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/verify_student.py
      - run: python3 tools/verify_witness_links.py
      - run: python3 tools/verify_network_consistency.py
      - run: python3 -m unittest discover -s tests -v

      - run: python3 tools/verify_release.py downloads/The-Last-Evidence-Standing-STUDENT.zip
